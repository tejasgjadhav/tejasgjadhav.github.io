{% extends "base.html" %}
{% block title %}Admin login · GlobalAAR{% endblock %}
{% block heading %}Admin login{% endblock %}
{% block content %}
<div class="card" style="max-width:360px">
  {% if request.query_params.get('bad') %}<div class="err">Wrong PIN.</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Admin PIN</label>
    <input type="password" name="pin" autofocus required>
    <div style="margin-top:12px"><button class="btn">Log in</button></div>
  </form>
</div>
{% endblock %}
